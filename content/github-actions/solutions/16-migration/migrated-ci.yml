name: Migrated Pets CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/server/requirements.txt
      - name: Test the API with an in-memory database
        working-directory: app/server
        env:
          DATABASE_PATH: ':memory:'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest test_app -v

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/server/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: app/client
      - run: npx playwright install --with-deps chromium
        working-directory: app/client
      - run: npm run test:e2e -- --project=chromium
        working-directory: app/client
        env:
          PYTHON: python
      - name: Retain browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pets-migration-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/client/playwright-report/
            app/client/test-results/
          if-no-files-found: warn
          retention-days: 7

  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: app/client
      - run: npm run build
        working-directory: app/client
      - name: Package the build and record its commit
        run: |
          mkdir -p pets-migration-build
          tar -czf pets-migration-build/site.tar.gz -C app/client/dist .
          cd pets-migration-build
          printf '%s\n' "$GITHUB_SHA" > commit.txt
          sha256sum site.tar.gz commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: pets-migration-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: pets-migration-build/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build-client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the producer's artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build-client.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing artifact ID"; exit 1; }'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-client.outputs.artifact-id }}
          merge-multiple: true
          path: build
      - name: Verify downloaded output
        working-directory: build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(cat commit.txt)" = "$EXPECTED_SHA"
          echo "Build checksum and commit verified. No deployment." >> "$GITHUB_STEP_SUMMARY"

  migration-passed:
    if: always()
    needs: [test-api, test-e2e, build-client, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation result
        env:
          API_RESULT: ${{ needs.test-api.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
          BUILD_RESULT: ${{ needs.build-client.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$API_RESULT" = success
          test "$E2E_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$VERIFY_RESULT" = success
