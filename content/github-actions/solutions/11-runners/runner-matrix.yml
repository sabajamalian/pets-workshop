name: Runner Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DATABASE_PATH: ':memory:'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/server/requirements.txt
      - name: Observe the runner
        shell: bash
        run: |
          printf 'OS=%s ARCH=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          python --version
      - run: python -m pip install -r app/server/requirements.txt
      - run: python -m unittest test_app -v
        working-directory: app/server
