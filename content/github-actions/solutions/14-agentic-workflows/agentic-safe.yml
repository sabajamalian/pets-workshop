name: Pets agentic simulation

on:
  workflow_dispatch:
    inputs:
      goal:
        description: Non-sensitive goal, recorded as data only (1 to 200 characters)
        required: true
        default: Explain how the shelter API tests validate dog listings
        type: string

permissions:
  contents: read

jobs:
  simulate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install dependencies outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pets-api-venv"
          "$RUNNER_TEMP/pets-api-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir -r app/server/requirements.txt
      - name: Intake, plan, act, observe, and validate once
        env:
          UNTRUSTED_GOAL: ${{ inputs.goal }}
          DATABASE_PATH: ':memory:'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -B content/github-actions/solutions/14-agentic-workflows/lifecycle.py simulate \
            --checkout "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/pets-agentic" \
            --python "$RUNNER_TEMP/pets-api-venv/bin/python"
      - name: Retain narrow audit records, including failures
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pets-agentic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pets-agentic/audit/
          if-no-files-found: error
          retention-days: 7

  human-audit:
    needs: simulate
    if: >-
      needs.simulate.result == 'success' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: pets-agentic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Require the producer artifact identity
        env:
          AUDIT_ARTIFACT_ID: ${{ needs.simulate.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.simulate.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pets-agentic-download
      - name: Verify data using trusted code, not artifact code
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -B content/github-actions/solutions/14-agentic-workflows/lifecycle.py audit \
            --directory "$RUNNER_TEMP/pets-agentic-download" --expected-sha "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          printf '%s\n' '## Pets simulation audit' \
            'Approved audit verified. No model, repository writes, or deployment.' >> "$GITHUB_STEP_SUMMARY"
