name: Pets Capstone

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Request an approved Azure deployment (may incur charges)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pets-capstone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the API without changing the shelter database
        working-directory: app/server
        env:
          DATABASE_PATH: ':memory:'
        run: python -m unittest test_app -v

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/server/requirements.txt
      - run: python -m pip install -r app/server/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - run: npm ci
        working-directory: app/client
      - run: npx playwright install --with-deps chromium
        working-directory: app/client
      - run: npm run test:e2e
        working-directory: app/client
      - name: Retain browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pets-browser-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/client/playwright-report/
            app/client/test-results/
          if-no-files-found: warn
          retention-days: 7

  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - run: npm ci
        working-directory: app/client
      - run: npm run build
        working-directory: app/client
      - name: Package the build
        run: |
          mkdir -p "$RUNNER_TEMP/pets-build"
          tar -czf "$RUNNER_TEMP/pets-build/site.tar.gz" -C app/client/dist .
          cd "$RUNNER_TEMP/pets-build"
          printf '%s\n' "$GITHUB_SHA" > commit.txt
          sha256sum site.tar.gz commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: pets-capstone-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pets-build/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build-client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the producer's artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build-client.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing artifact ID"; exit 1; }'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-client.outputs.artifact-id }}
          merge-multiple: true
          path: build
      - name: Verify downloaded output
        working-directory: build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(cat commit.txt)" = "$EXPECTED_SHA"

  capstone-passed:
    if: always()
    needs: [test-api, test-e2e, build-client, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation result
        env:
          API_RESULT: ${{ needs.test-api.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
          BUILD_RESULT: ${{ needs.build-client.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$API_RESULT" = success
          test "$E2E_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$VERIFY_RESULT" = success

  post-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-client, capstone-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the producer's artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build-client.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing artifact ID"; exit 1; }'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-client.outputs.artifact-id }}
          merge-multiple: true
          path: build
      - working-directory: build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(cat commit.txt)" = "$EXPECTED_SHA"
          echo "Post-merge build verified. No deployment requested." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: capstone-passed
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      deploy-ref: ${{ github.sha }}
      environment-name: pets-production
