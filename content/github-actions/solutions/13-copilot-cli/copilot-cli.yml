name: Pets Copilot CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not install or call Copilot CLI
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    if: >-
      inputs.dry_run &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Generate a deterministic report without AI credentials
        shell: bash
        run: |
          set -euo pipefail
          python -B content/github-actions/solutions/13-copilot-cli/report.py \
            --checkout "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/pets-copilot" --mode dry
          printf '%s\n' '## Pets CLI dry run' \
            'No CLI was installed, no model was called, and no AI credential was read.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pets-copilot-dry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pets-copilot/report/
          if-no-files-found: error
          retention-days: 7

  approved-cli:
    if: >-
      !inputs.dry_run &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: pets-copilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install only the reviewed CLI version outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pets-cli-package" --no-audit --no-fund @github/copilot@1.0.87
      - name: Explain one trusted file with read-only tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PETS_COPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -B content/github-actions/solutions/13-copilot-cli/report.py \
            --checkout "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/pets-copilot" \
            --mode live --cli "$RUNNER_TEMP/pets-cli-package/node_modules/.bin/copilot"
          printf '%s\n' '## Pets CLI report' \
            'Read the untrusted report artifact as text. It is not a test or approval result.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pets-copilot-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pets-copilot/report/
          if-no-files-found: error
          retention-days: 7
